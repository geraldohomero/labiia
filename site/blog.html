<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | LABIIA LAB</title>
  <meta name="description" content="Blog do LABIIA LAB com artigos sobre IA generativa, política e democracia.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="blog">
  <div class="page-glow" aria-hidden="true"></div>
  <div id="site-header"></div>

  <main class="blog-main">
    <section class="blog-hero reveal">
      <p class="kicker">Publicações do Laboratório</p>
      <h1>Blog LABIIA</h1>
      <p>
        Conteúdos curtos e acionáveis para pesquisadores, formuladores de política pública e comunicadores.
      </p>
    </section>

    <section class="filters reveal" id="blog-filters" aria-label="Filtros de categoria">
      <button class="filter active" data-filter="all">Todos</button>
    </section>

    <section class="posts-grid reveal" id="posts-grid" aria-live="polite">
      <article class="post-card" id="posts-loading">
        <p class="preview-meta">Carregando...</p>
        <h2>Buscando posts em Markdown</h2>
        <p>Se essa mensagem não sair, verifique se o servidor local está ativo.</p>
      </article>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
